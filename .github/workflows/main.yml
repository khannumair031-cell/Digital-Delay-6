name: Build DD-6 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project
        run: |
          find . -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd DD6-NUMAIR-2026
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DD6-debug-apk
          path: DD6-NUMAIR-2026/app/build/outputs/apk/debug/*.apk
