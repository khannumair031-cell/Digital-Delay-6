name: Build DD-6 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o DD6-NUMAIR-2026-test-ready.zip -d project

      - name: Fix MainActivity
        run: |
          FILE=$(find project -name MainActivity.java | head -1)
          sed -i 's/WebView.setWebContentsDebuggingEnabled(BuildConfig.DEBUG);/WebView.setWebContentsDebuggingEnabled(true);/' "$FILE"

      - name: Fix Kotlin duplicate libraries
        run: |
          FILE=$(find project -name build.gradle | grep '/app/' | head -1)
          cat >> "$FILE" <<'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle | head -1)")
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DD6-debug-apk
          path: "project/**/app/build/outputs/apk/debug/*.apk"
